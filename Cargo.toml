[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.86"
axum = "=0.7.5"
blake3 = "=1.5.1"
clap = { version = "=4.5.4", features = ["derive"] }
libc = "=0.2.155"
regex = "=1.10.5"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tempfile = "=3.10.1"
tokio = { version = "=1.38.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
